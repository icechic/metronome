<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="节拍器">
<meta name="theme-color" content="#0d0f14">
<meta name="description" content="免费离线网页节拍器：30–240 BPM、拍号 2/4–6/4、每拍细分（八分/三连音/十六分/六连音）、TAP 测速。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<title>节拍器 · 免费离线版</title>
<style>
:root{--bg:#0d0f14;--fg:#e8ecf3;--dim:#8b93a3;--acc:#4ade80;--acc2:#fbbf24;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang SC",system-ui,sans-serif;overflow:hidden;user-select:none;}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:16px;}
#bpm{font-size:78px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-3px;}
.unit{font-size:12px;color:var(--dim);letter-spacing:4px;text-align:center;margin-top:6px}
.beats{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:nowrap;min-height:20px}
.beat{display:flex;gap:5px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;background:#252a35;transition:background .05s,transform .05s}
.dot.on{background:var(--acc);transform:scale(1.45)}
.dot.on.acc{background:var(--acc2)}
.sdot{width:7px;height:7px;border-radius:50%;background:#252a35;transition:background .05s,transform .05s}
.sdot.on{background:#7f8fa6;transform:scale(1.4)}
.sdot.on.acc{background:#a3b0c2}
.row{display:flex;align-items:center;gap:12px;width:min(430px,92vw)}
.row label{font-size:13px;color:var(--dim);width:52px;flex:none}
input[type=range]{-webkit-appearance:none;flex:1;height:36px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#252a35}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;
  border-radius:50%;background:var(--fg);box-shadow:0 2px 8px #000a}
.val{width:52px;text-align:right;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-direction:column;gap:9px;width:min(430px,92vw)}
button{border:0;border-radius:14px;background:#1b2029;color:var(--fg);font-size:15px;
  padding:13px 20px;font-family:inherit;transition:transform .07s,background .15s}
button:active{transform:scale(.96)}
button.main{background:var(--acc);color:#08210f;font-weight:600;font-size:18px;padding:17px 46px;border-radius:20px;width:100%}
button.main.stop{background:#ef4444;color:#fff}
button.mini{padding:11px 14px;font-size:13px;flex:1;min-width:0}
button.sel{background:var(--acc);color:#08210f;font-weight:600}
.subrow button{padding:9px 4px;font-size:13px}
.hint{font-size:12px;color:#5d6472;text-align:center;line-height:1.7}
.status{font-size:12px;padding:7px 14px;border-radius:999px;background:#161b23;color:#7d8698;border:1px solid #1f2632}
.status.ok{color:#4ade80;border-color:#1d3a28}
.status.warn{color:#fbbf24;border-color:#3a2f13}
.flash{position:fixed;inset:0;background:var(--acc);opacity:0;pointer-events:none;transition:opacity .12s}
.flash.acc{background:var(--acc2)}
@media (min-width:760px){
  #bpm{font-size:120px}
  .wrap{gap:18px}
  .row,.btns{width:min(520px,92vw)}
}
@media (max-height:760px){
  .wrap{gap:8px;padding:10px}
  #bpm{font-size:58px}
  .hint{display:none}
  button.main{padding:13px 40px;font-size:17px}
  button.mini{padding:9px 12px}
}
@media (max-width:340px){
  #bpm{font-size:64px}
  .row label{width:44px;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div id="bpm">100</div>
    <div class="unit">BPM</div>
  </div>
  <div class="beats" id="dots"></div>
  <div class="row">
    <label>速度</label>
    <input type="range" id="slider" min="30" max="240" step="1" value="100">
    <div class="val" id="val">100</div>
  </div>
  <div class="row">
    <label>拍号</label>
    <div style="flex:1;display:flex;gap:5px;flex-wrap:wrap" id="meters"></div>
  </div>
  <div class="row">
    <label>细分</label>
    <div style="flex:1;display:flex;gap:5px;flex-wrap:wrap" id="subs"></div>
  </div>
  <div class="row">
    <label>音量</label>
    <input type="range" id="vol" min="0" max="100" step="1" value="70">
    <div class="val" id="volv">70</div>
  </div>
  <div class="btns">
    <button class="main" id="play">开始</button>
    <div style="display:flex;gap:9px;width:100%">
      <button class="mini" id="tap">TAP 测速</button>
      <button class="mini" id="minus">−5</button>
      <button class="mini" id="plus">+5</button>
    </div>
  </div>
  <div class="status" id="status">点「开始」应有声音（静音开关需关闭）</div>
  <div class="hint" id="hint">细分 3 = 每拍三等分（三连音）· 细分 2 = 两个八分音符</div>
</div>
<div class="flash" id="flash"></div>
<script>
var AC = window.AudioContext || window.webkitAudioContext;
var ctx = null, master = null;
var bpm = 100, meter = 4, sub = 1, playing = false, volume = 0.7;
var nextPerf = 0, curBeat = 0, curSub = 0, timerId = null, paintId = null;
var LOOKAHEAD_MS = 25, SCHEDULE_AHEAD = 0.12;
var queue = [], tapTimes = [];
var fbAccent = null, fbMain = null, fbSub = null;

var $ = function(id){ return document.getElementById(id); };
var dotsEl = $('dots'), flashEl = $('flash'), statusEl = $('status'), hintEl = $('hint');

var SUB_LABELS = {1:'1', 2:'2', 3:'3', 4:'4', 6:'6'};
var SUB_NAMES = {1:'每拍 1 下（四分音符）', 2:'每拍 2 等分（两个八分音符）',
  3:'每拍 3 等分（三连音）', 4:'每拍 4 等分（十六分音符）', 6:'每拍 6 等分（六连音）'};

function nowSec(){ return performance.now() / 1000; }

/* ================= 备用发声：把 click 预渲染成 WAV ================= */
function makeTickURI(freq, peak, dur, thump){
  var sr = 22050, n = Math.floor(sr * dur);
  var buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  function ws(off, str){ for(var i=0;i<str.length;i++) v.setUint8(off+i, str.charCodeAt(i)); }
  ws(0,'RIFF'); v.setUint32(4, 36 + n*2, true); ws(8,'WAVE');
  ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40, n*2, true);
  for(var i=0;i<n;i++){
    var t = i/sr;
    var env = Math.exp(-t * (thump ? 42 : 70));
    var sig = Math.sin(2*Math.PI*freq*t)*0.72
            + Math.sin(2*Math.PI*freq*0.5*t)*0.28
            + Math.sin(2*Math.PI*freq*1.6*t)*0.15;
    if(thump) sig += Math.sin(2*Math.PI*90*t)*0.5*Math.exp(-t*40);
    var val = Math.max(-1, Math.min(1, sig*env*peak));
    v.setInt16(44 + i*2, val*0x7fff, true);
  }
  var bytes = new Uint8Array(buf), bin = '';
  for(var k=0;k<bytes.length;k++) bin += String.fromCharCode(bytes[k]);
  return 'data:audio/wav;base64,' + btoa(bin);
}

function initFallback(){
  if(fbAccent) return;
  try{
    fbAccent = new Audio(makeTickURI(2100, 0.95, 0.10, true));
    fbMain   = new Audio(makeTickURI(1250, 0.60, 0.08, true));
    fbSub    = new Audio(makeTickURI(1550, 0.30, 0.045, false));
    [fbAccent, fbMain, fbSub].forEach(function(a){ a.preload = 'auto'; });
  }catch(e){}
}

function playFallback(which){
  initFallback();
  var a = which === 'acc' ? fbAccent : (which === 'main' ? fbMain : fbSub);
  if(!a) return;
  try{
    a.currentTime = 0;
    var p = a.play();
    if(p && p.catch) p.catch(function(){});
  }catch(e){}
}

/* ================= 主引擎：WebAudio ================= */
function ensureCtx(){
  if(ctx || !AC) return;
  try{
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = volume;
    master.connect(ctx.destination);
  }catch(e){ ctx = null; }
}

function unlockAudio(){
  ensureCtx();
  initFallback();
  if(ctx){
    try{
      if(ctx.state !== 'running'){
        var p = ctx.resume();
        if(p && p.then) p.then(updateStatus).catch(function(){});
      }
      var b = ctx.createBuffer(1, 1, ctx.sampleRate || 44100);
      var src = ctx.createBufferSource();
      src.buffer = b; src.connect(ctx.destination); src.start(0);
    }catch(e){}
  }
  updateStatus();
}

function click(time, accent){
  if(!ctx || ctx.state !== 'running') return false;
  var o1=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
  var f = accent ? 2100 : 1250;
  o1.type='square'; o1.frequency.value=f;
  o2.type='sine';   o2.frequency.value=f*0.5;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(accent?1.0:0.5, time+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time+0.05);
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(time); o1.stop(time+0.08);
  o2.start(time); o2.stop(time+0.08);

  var o3=ctx.createOscillator(), g3=ctx.createGain();
  o3.type='sine';
  o3.frequency.setValueAtTime(accent?190:150, time);
  o3.frequency.exponentialRampToValueAtTime(62, time+0.055);
  g3.gain.setValueAtTime(0.0001, time);
  g3.gain.exponentialRampToValueAtTime(accent?0.45:0.22, time+0.004);
  g3.gain.exponentialRampToValueAtTime(0.0001, time+0.075);
  o3.connect(g3); g3.connect(master);
  o3.start(time); o3.stop(time+0.09);
  return true;
}

/* 细分音符：短促轻音 */
function subClick(time, lastOfBeat){
  if(!ctx || ctx.state !== 'running') return false;
  var o=ctx.createOscillator(), g=ctx.createGain();
  o.type='sine';
  o.frequency.value = lastOfBeat ? 1500 : 1700;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(0.28, time+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time+0.035);
  o.connect(g); g.connect(master);
  o.start(time); o.stop(time+0.05);
  return true;
}

/* ================= 状态条 ================= */
function updateStatus(){
  if(!statusEl) return;
  if(ctx && ctx.state === 'running'){
    statusEl.className='status ok'; statusEl.textContent='🔊 声音已开启';
  }else if(playing){
    statusEl.className='status warn'; statusEl.textContent='🔇 没声音？点这里启用';
  }else{
    statusEl.className='status'; statusEl.textContent='点「开始」应有声音（静音开关需关闭）';
  }
}
statusEl.onclick = function(){
  unlockAudio();
  playFallback(sub === 1 ? 'main' : 'sub');
  updateStatus();
};

/* ================= 界面 ================= */
function rebuildDots(){
  dotsEl.innerHTML = '';
  var total = meter * sub;
  dotsEl.style.gap = total > 24 ? '8px' : '14px';
  for(var i=0;i<meter;i++){
    var g = document.createElement('div');
    g.className='beat';
    g.style.gap = total > 24 ? '3px' : '5px';
    for(var k=0;k<sub;k++){
      var d = document.createElement('div');
      d.className = (k===0 ? 'dot' : 'sdot');
      if(total > 24){
        d.style.width = k===0 ? '9px' : '5px';
        d.style.height = k===0 ? '9px' : '5px';
      }
      g.appendChild(d);
    }
    dotsEl.appendChild(g);
  }
}

function buildMeters(){
  var box=$('meters'); box.innerHTML='';
  for(var i=2;i<=6;i++){
    (function(n){
      var b=document.createElement('button');
      b.className='mini'+(n===meter?' sel':'');
      b.style.cssText='flex:1;min-width:0;padding:9px 2px;font-size:13px;border-radius:11px';
      b.textContent=n+'/4';
      b.onclick=function(){
        meter=n; rebuildDots(); buildMeters();
        if(playing){ curBeat=0; curSub=0; }
      };
      box.appendChild(b);
    })(i);
  }
}

function buildSubs(){
  var box=$('subs'); box.innerHTML='';
  [1,2,3,4,6].forEach(function(n){
    var b=document.createElement('button');
    b.className='mini'+(n===sub?' sel':'');
    b.style.cssText='flex:1;min-width:0;padding:9px 2px;font-size:13px;border-radius:11px';
    b.textContent = SUB_LABELS[n];
    b.onclick=function(){
      sub=n; rebuildDots(); buildSubs(); updateHint();
      if(playing){ curSub=0; }
    };
    box.appendChild(b);
  });
}

function updateHint(){
  hintEl.textContent = SUB_NAMES[sub];
}

/* ================= 调度 ================= */
function stepDur(){ return (60 / bpm) / sub; }

function scheduler(){
  var now = nowSec();
  while(nextPerf < now + SCHEDULE_AHEAD){
    var delay = Math.max(0, nextPerf - now);
    var isMain = (curSub === 0);
    var isAccent = isMain && (curBeat === 0);
    var played = false;
    if(ctx && ctx.state === 'running'){
      played = isMain ? click(ctx.currentTime + delay + 0.005, isAccent)
                      : subClick(ctx.currentTime + delay + 0.005, curSub === sub - 1);
    }
    queue.push({t: nextPerf, b: curBeat, s: curSub, main: isMain, acc: isAccent, fb: !played});
    nextPerf += stepDur();
    curSub++;
    if(curSub >= sub){ curSub = 0; curBeat = (curBeat + 1) % meter; }
  }
}

function paintTick(){
  if(!playing) return;
  var now = nowSec();
  while(queue.length && queue[0].t <= now){
    var q = queue.shift();
    if(q.fb) playFallback(q.acc ? 'acc' : (q.main ? 'main' : 'sub'));
    paintBeat(q.b, q.s, q.main, q.acc);
  }
}

var flashTimer = null;
function paintBeat(b, sIdx, isMain, isAccent){
  var groups = dotsEl.children;
  for(var i=0;i<groups.length;i++){
    var kids = groups[i].children;
    for(var k=0;k<kids.length;k++){
      var mainDot = (k === 0);
      var on = (i === b) && (mainDot ? sIdx === 0 : sIdx === k);
      var cls = mainDot ? 'dot' : 'sdot';
      if(on) cls += ' on' + (i === 0 && mainDot ? ' acc' : '');
      kids[k].className = cls;
    }
  }
  if(isMain){
    flashEl.className = 'flash' + (isAccent ? ' acc' : '');
    flashEl.style.opacity = isAccent ? 0.18 : 0.09;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ flashEl.style.opacity = 0; }, 70);
  }
}

function start(){
  unlockAudio();
  playing = true;
  curBeat = 0; curSub = 0;
  queue.length = 0;
  nextPerf = nowSec() + 0.1;
  $('play').textContent = '停止';
  $('play').classList.add('stop');
  clearInterval(timerId);
  timerId = setInterval(scheduler, LOOKAHEAD_MS);
  scheduler();
  clearInterval(paintId);
  paintId = setInterval(paintTick, 16);
  updateStatus();
  setTimeout(updateStatus, 400);
}

function stop(){
  playing = false;
  clearInterval(timerId); timerId = null;
  clearInterval(paintId); paintId = null;
  queue.length = 0;
  $('play').textContent = '开始';
  $('play').classList.remove('stop');
  var groups = dotsEl.children;
  for(var i=0;i<groups.length;i++){
    var kids = groups[i].children;
    for(var k=0;k<kids.length;k++) kids[k].className = (k===0 ? 'dot' : 'sdot');
  }
  flashEl.style.opacity = 0;
  updateStatus();
}

/* ================= 交互 ================= */
$('play').onclick = function(){ playing ? stop() : start(); };

function setBpm(v){
  bpm = Math.min(240, Math.max(30, Math.round(v)));
  $('slider').value = bpm;
  $('bpm').textContent = bpm;
  $('val').textContent = bpm;
}

$('slider').oninput = function(){ setBpm(parseInt(this.value,10)); };
$('vol').oninput = function(){
  volume = parseInt(this.value,10)/100;
  $('volv').textContent = this.value;
  if(master) master.gain.value = volume;
};
$('minus').onclick = function(){ setBpm(bpm - 5); };
$('plus').onclick  = function(){ setBpm(bpm + 5); };

$('tap').onclick = function(){
  var t = performance.now();
  if(tapTimes.length && t - tapTimes[tapTimes.length-1] > 2000) tapTimes = [];
  tapTimes.push(t);
  if(tapTimes.length > 6) tapTimes.shift();
  if(tapTimes.length >= 2){
    var sum = 0;
    for(var i=1;i<tapTimes.length;i++) sum += tapTimes[i]-tapTimes[i-1];
    var b = Math.round(60000 / (sum/(tapTimes.length-1)));
    if(b >= 30 && b <= 240) setBpm(b);
  }
};

document.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault(); playing ? stop() : start(); }
  if(e.key === 'ArrowUp'){ e.preventDefault(); setBpm(bpm+1); }
  if(e.key === 'ArrowDown'){ e.preventDefault(); setBpm(bpm-1); }
});

document.addEventListener('pointerdown', function(){
  if(!ctx || ctx.state !== 'running') unlockAudio();
}, true);

rebuildDots();
buildMeters();
buildSubs();
updateHint();
updateStatus();
</script>
</body>
</html>
