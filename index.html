<style>
:root{--bg:#0d0f14;--fg:#e8ecf3;--dim:#8b93a3;--acc:#4ade80;--acc2:#fbbf24;--acc3:#60a5fa;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang SC",system-ui,sans-serif;overflow:hidden;user-select:none;}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;}
#bpm{font-size:74px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-3px;}
.unit{font-size:12px;color:var(--dim);letter-spacing:4px;text-align:center;margin-top:5px}
.beats{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;min-height:20px;gap:0}
.group{display:flex;align-items:center;gap:5px}
.group+.group{margin-left:15px;position:relative}
.group+.group::before{content:'';position:absolute;left:-8px;top:50%;width:1px;height:15px;
  margin-top:-7.5px;background:#2c3542}
.unit1{display:flex;align-items:center;gap:4px}
.dot{width:13px;height:13px;border-radius:50%;background:#252a35;transition:background .05s,transform .05s;flex:none}
.dot.gp{background:#5a6879}
.dot.on{background:var(--acc);transform:scale(1.45)}
.dot.on.acc{background:var(--acc2)}
.sdot{width:7px;height:7px;border-radius:50%;background:#252a35;transition:background .05s,transform .05s;flex:none}
.sdot.on{background:#7f8fa6;transform:scale(1.4)}
.sdot.on.acc{background:#a3b0c2}
.row{display:flex;align-items:center;gap:10px;width:min(430px,93vw)}
.row label{font-size:13px;color:var(--dim);width:44px;flex:none}
input[type=range]{-webkit-appearance:none;flex:1;height:34px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#252a35}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;
  border-radius:50%;background:var(--fg);box-shadow:0 2px 8px #000a}
.val{width:44px;text-align:right;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-direction:column;gap:8px;width:min(430px,93vw)}
button{border:0;border-radius:13px;background:#1b2029;color:var(--fg);font-size:15px;
  padding:12px 18px;font-family:inherit;transition:transform .07s,background .15s}
button:active{transform:scale(.96)}
button.main{background:var(--acc);color:#08210f;font-weight:600;font-size:18px;padding:16px 46px;border-radius:20px;width:100%}
button.main.stop{background:#ef4444;color:#fff}
button.mini{padding:10px 12px;font-size:13px;flex:1;min-width:0}
button.sel{background:var(--acc);color:#08210f;font-weight:600}
.hint{font-size:12px;color:#5d6472;text-align:center;line-height:1.6}
.status{font-size:12px;padding:6px 14px;border-radius:999px;background:#161b23;color:#7d8698;border:1px solid #1f2632}
.status.ok{color:#4ade80;border-color:#1d3a28}
.status.warn{color:#fbbf24;border-color:#3a2f13}
.flash{position:fixed;inset:0;background:var(--acc);opacity:0;pointer-events:none;transition:opacity .12s}
.flash.acc{background:var(--acc2)}
.sheet{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.sheet.show{display:flex}
.card{background:#151a22;border-radius:18px;padding:20px;width:min(360px,92vw);border:1px solid #232a36}
.card h3{margin:0 0 6px;font-size:16px;font-weight:600}
.card p{margin:0 0 14px;font-size:12px;color:var(--dim);line-height:1.6}
.card input{width:100%;background:#0d1117;border:1px solid #2a3240;border-radius:11px;color:var(--fg);
  font-size:20px;text-align:center;padding:12px;letter-spacing:2px;font-family:inherit}
.card .btns2{display:flex;gap:9px;margin-top:13px}
.card button{flex:1}
@media (min-width:760px){
  #bpm{font-size:112px}
  .row,.btns{width:min(520px,93vw)}
}

  .hint{display:none}
  button.main{padding:12px 40px;font-size:17px}
  button.mini{padding:8px 10px}

<body>
<div class="wrap">
  <div>
    <div id="bpm">100</div>
    <div class="unit">BPM</div>
  </div>
  <div class="beats" id="dots"></div>
  <div class="row">
    <label>速度</label>
    <input type="range" id="slider" min="30" max="240" step="1" value="100">
    <div class="val" id="val">100</div>
  </div>
  <div class="row">
    <label>拍号</label>
    <div style="flex:1;display:flex;gap:5px;flex-wrap:wrap" id="meters"></div>
  </div>
  <div class="row">
    <label>细分</label>
    <div style="flex:1;display:flex;gap:5px;flex-wrap:wrap" id="subs"></div>
  </div>
  <div class="row">
    <label>音量</label>
    <input type="range" id="vol" min="0" max="100" step="1" value="70">
    <div class="val" id="volv">70</div>
  </div>
  <div class="row">
    <label>音色</label>
    <div style="flex:1;display:flex;gap:6px" id="tones"></div>
  </div>
  <div class="btns">
    <button class="main" id="play">开始</button>
    <div style="display:flex;gap:6px;width:100%">
      <button class="mini" id="tap" style="flex:1.5">TAP</button>
      <button class="mini" id="m4">−4</button>
      <button class="mini" id="m3">−3</button>
      <button class="mini" id="p3">+3</button>
      <button class="mini" id="p4">+4</button>
    </div>
  </div>
  <div class="status" id="status">点「开始」应有声音（静音开关需关闭）</div>
  <div class="hint" id="hint">每拍 1 下（四分音符）</div>
</div>
<div class="flash" id="flash"></div>

<div class="sheet" id="sheet">
  <div class="card">
    <h3>自定义分组</h3>
    <p>用 + 连接每组拍数，例如 4+1+1+4（共 10 拍）、3+3+2、2+2+2+3、4+11+4（共 19 拍）。每组第一拍为组首重音，小节第一拍为最高重音。</p>
    <input id="gin" type="text" inputmode="numeric" placeholder="4+1+1+4">
    <div class="btns2">
      <button class="mini" id="gcancel">取消</button>
      <button class="mini" id="gok" style="background:var(--acc);color:#08210f;font-weight:600">确定</button>
    </div>
  </div>
</div>
<script>
var AC = window.AudioContext || window.webkitAudioContext;
var ctx = null, master = null;
var bpm = 100, sub = 1, playing = false, volume = 0.7;
var nextPerf = 0, timerId = null, paintId = null;
var LOOKAHEAD_MS = 25, SCHEDULE_AHEAD = 0.12;
var queue = [], tapTimes = [];
var fbAccent = null, fbMain = null, fbSub = null;
var tone = 'click';   // 'click' | 'wood'（木鱼）
var TONE_NAMES = {click:'点击', wood:'木鱼'};

/* ===== 节奏模型 =====
   groups = [4,1,1,4]：一小节分 4 组，各组分别有 4、1、1、4 拍
   展开为 cells，每个 cell 记录所属组、是否组首；小节首拍为最高重音 */
var pattern = [4];
var cells = [];
var curCell = 0, curSub = 0;
var meterLabel = '4/4';
var customActive = false;

var PRESETS = [
  {label:'1/4',     groups:[1]},
  {label:'2/4',     groups:[2]},
  {label:'3/4',     groups:[3]},
  {label:'4/4',     groups:[4]},
  {label:'6/4',     groups:[6]},
  {label:'3+3',     groups:[3,3]},
  {label:'3+3+2',   groups:[3,3,2]},
  {label:'4+1+1+4', groups:[4,1,1,4]},
  {label:'自定义',   custom:true}
];

var $ = function(id){ return document.getElementById(id); };
var dotsEl = $('dots'), flashEl = $('flash'), statusEl = $('status'), hintEl = $('hint');

var SUB_NAMES = {1:'每拍 1 下（四分音符）', 2:'每拍 2 等分（两个八分音符）',
  3:'每拍 3 等分（三连音）', 4:'每拍 4 等分（十六分音符）', 6:'每拍 6 等分（六连音）'};

function nowSec(){ return performance.now() / 1000; }

/* ================= 声音合成（WAV 与 WebAudio 共用一套参数） =================
   木鱼用「模态合成」：非谐和泛音列 + 极短宽带敲击噪声。
   每个模态有自己的衰减时间，且频率随时间轻微下滑 —— 这是木制品敲击的听感来源。
   级别：2=小节重音 1=组首 0=普通拍 3=细分音 */

var WOOD_LEVELS = {
  2: { base: 620, ratios: [1.00, 1.59, 2.14, 3.09],
       decays: [0.085, 0.055, 0.038, 0.022],
       amps:   [1.00, 0.55, 0.30, 0.15], noise: 0.55, ndec: 0.0035, dur: 0.20 },
  1: { base: 560, ratios: [1.00, 1.59, 2.14, 3.09],
       decays: [0.070, 0.046, 0.032, 0.019],
       amps:   [1.00, 0.50, 0.26, 0.12], noise: 0.48, ndec: 0.0032, dur: 0.17 },
  0: { base: 500, ratios: [1.00, 1.59, 2.14, 3.09],
       decays: [0.058, 0.038, 0.026, 0.016],
       amps:   [1.00, 0.45, 0.22, 0.10], noise: 0.42, ndec: 0.0030, dur: 0.15 },
  3: { base: 780, ratios: [1.00, 1.72],
       decays: [0.030, 0.018],
       amps:   [1.00, 0.40],           noise: 0.30, ndec: 0.0022, dur: 0.07 }
};

/* 单个采样点的木鱼波形 */
function woodSample(t, cfg, seedNoise){
  var sum = 0;
  for(var i=0;i<cfg.ratios.length;i++){
    // 敲击后张力松弛：频率在衰减期内轻微下滑
    var d = cfg.decays[i];
    var sag = 1.0 - 0.012 * Math.min(t / d, 1.0);
    var f = cfg.base * cfg.ratios[i] * sag;
    sum += cfg.amps[i] * Math.sin(2 * Math.PI * f * t) * Math.exp(-t / d);
  }
  // 敲击瞬态：极短宽带噪声
  if(t < cfg.ndec * 6){
    sum += seedNoise * Math.exp(-t / cfg.ndec) * cfg.noise;
  }
  return sum;
}

/* 预渲染成 WAV（给没有 WebAudio 的环境用） */
function makeWavURI(kind, level){
  var sr = 22050;
  var dur, cfg;
  if(kind === 'wood'){
    cfg = WOOD_LEVELS[level] || WOOD_LEVELS[0];
    dur = cfg.dur;
  } else {
    cfg = null;
    dur = level === 3 ? 0.05 : 0.11;
  }

  var n = Math.floor(sr * dur);
  var samples = new Float32Array(n), peak = 0;

  // 噪声提前生成一份，保证左右一致、可复现
  var seed = 12345;
  function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff * 2 - 1; }

  for(var i=0;i<n;i++){
    var t = i / sr, val;
    if(kind === 'wood'){
      val = woodSample(t, cfg, rnd());
    } else {
      var accent = (level === 2), strong = (level === 1), isSub = (level === 3);
      var f = accent ? 2150 : (strong ? 1550 : 1150);
      if(isSub) f = 1700;
      var pk = accent ? 0.95 : (strong ? 0.74 : (isSub ? 0.26 : 0.46));
      var env = Math.exp(-t * (isSub ? 75 : 46));
      var sq = Math.sign(Math.sin(2*Math.PI*f*t)) * 0.5;
      var si = Math.sin(2*Math.PI*f*0.5*t) * 0.5;
      var body = Math.sin(2*Math.PI*(accent?190:(strong?170:140))*t) * Math.exp(-t*38) * 0.5;
      val = (sq * 0.55 + si * 0.35 + body) * env * pk;
    }
    samples[i] = val;
    var a = Math.abs(val);
    if(a > peak) peak = a;
  }

  var norm = peak > 0 ? 0.86 / peak : 1;
  var buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  function ws(off, str){ for(var i=0;i<str.length;i++) v.setUint8(off+i, str.charCodeAt(i)); }
  ws(0,'RIFF'); v.setUint32(4, 36 + n*2, true); ws(8,'WAVE');
  ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40, n*2, true);
  for(var j=0;j<n;j++){
    var q = Math.max(-1, Math.min(1, samples[j] * norm));
    v.setInt16(44 + j*2, q * 0x7fff, true);
  }
  var bytes = new Uint8Array(buf), bin = '';
  for(var k=0;k<bytes.length;k++) bin += String.fromCharCode(bytes[k]);
  return 'data:audio/wav;base64,' + btoa(bin);
}

/* 缓存：按 音色+级别 生成，最多 8 个 */
var fbCache = {};
function fbAudio(kind, level){
  var key = kind + level;
  if(fbCache[key]) return fbCache[key];
  try{
    var a = new Audio(makeWavURI(kind, level));
    a.preload = 'auto';
    fbCache[key] = a;
    return a;
  }catch(e){ return null; }
}

function initFallback(){
  // 预热常用档位
  fbAudio('click', 2); fbAudio('click', 0); fbAudio('click', 3);
  fbAudio('wood', 2);  fbAudio('wood', 0);  fbAudio('wood', 3);
}

function playFallback(which){
  // which: 'acc' | 'main' | 'sub'
  var level = which === 'acc' ? 2 : (which === 'sub' ? 3 : 0);
  var a = fbAudio(tone, level);
  if(!a) return;
  try{
    a.currentTime = 0;
    var p = a.play();
    if(p && p.catch) p.catch(function(){});
  }catch(e){}
}

/* ================= WebAudio ================= */
function ensureCtx(){
  if(ctx || !AC) return;
  try{
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = volume;
    master.connect(ctx.destination);
  }catch(e){ ctx = null; }
}

function unlockAudio(){
  ensureCtx();
  initFallback();
  if(ctx){
    try{
      if(ctx.state !== 'running'){
        var p = ctx.resume();
        if(p && p.then) p.then(updateStatus).catch(function(){});
      }
      var b = ctx.createBuffer(1, 1, ctx.sampleRate || 44100);
      var src = ctx.createBufferSource();
      src.buffer = b; src.connect(ctx.destination); src.start(0);
    }catch(e){}
  }
  updateStatus();
}


/* ============ 木鱼音色（WebAudio 版，参数同 WAV） ============ */
function woodClick(time, level){
  if(!ctx || ctx.state !== 'running') return false;
  var cfg = WOOD_LEVELS[level] || WOOD_LEVELS[0];

  // 非谐和泛音列：每个模态一个振荡器 + 独立包络
  for(var i=0;i<cfg.ratios.length;i++){
    (function(r, d, a){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      var f = cfg.base * r;
      o.frequency.setValueAtTime(f, time);
      o.frequency.exponentialRampToValueAtTime(f * 0.985, time + d * 1.4);
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(a * 0.5, time + 0.0015);
      g.gain.exponentialRampToValueAtTime(0.0001, time + d * 3.6);
      o.connect(g); g.connect(master);
      o.start(time); o.stop(time + d * 3.8 + 0.01);
    })(cfg.ratios[i], cfg.decays[i], cfg.amps[i]);
  }

  // 敲击瞬态：极短高频噪声，带通在 2.4 倍基频附近
  var nd = 0.012;
  var buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * nd)), ctx.sampleRate);
  var data = buf.getChannelData(0);
  for(var n=0;n<data.length;n++){
    data[n] = (Math.random()*2 - 1) * Math.pow(1 - n/data.length, 3);
  }
  var src = ctx.createBufferSource(); src.buffer = buf;
  var bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = cfg.base * 2.4;
  bp.Q.value = 0.9;
  var ng = ctx.createGain();
  ng.gain.value = cfg.noise * 0.55;
  src.connect(bp); bp.connect(ng); ng.connect(master);
  src.start(time);
  return true;
}

/* level: 2=小节重音 1=组首 0=普通拍 3=细分音 */
function click(time, level){
  if(tone === 'wood') return woodClick(time, level);
  if(!ctx || ctx.state !== 'running') return false;
  if(level === 3){
    var os=ctx.createOscillator(), gs=ctx.createGain();
    os.type='sine'; os.frequency.value=1700;
    gs.gain.setValueAtTime(0.0001, time);
    gs.gain.exponentialRampToValueAtTime(0.26, time+0.002);
    gs.gain.exponentialRampToValueAtTime(0.0001, time+0.032);
    os.connect(gs); gs.connect(master);
    os.start(time); os.stop(time+0.045);
    return true;
  }
  var accent = (level === 2), strong = (level === 1);
  var f = accent ? 2150 : (strong ? 1550 : 1150);
  var peak = accent ? 1.0 : (strong ? 0.74 : 0.46);
  var o1=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
  o1.type='square'; o1.frequency.value=f;
  o2.type='sine';   o2.frequency.value=f*0.5;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(peak, time+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time+0.05);
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(time); o1.stop(time+0.08);
  o2.start(time); o2.stop(time+0.08);

  var o3=ctx.createOscillator(), g3=ctx.createGain();
  o3.type='sine';
  o3.frequency.setValueAtTime(accent?190:(strong?170:140), time);
  o3.frequency.exponentialRampToValueAtTime(62, time+0.055);
  g3.gain.setValueAtTime(0.0001, time);
  g3.gain.exponentialRampToValueAtTime(accent?0.45:(strong?0.30:0.18), time+0.004);
  g3.gain.exponentialRampToValueAtTime(0.0001, time+0.075);
  o3.connect(g3); g3.connect(master);
  o3.start(time); o3.stop(time+0.09);
  return true;
}

function updateStatus(){
  if(!statusEl) return;
  if(ctx && ctx.state === 'running'){
    statusEl.className='status ok'; statusEl.textContent='🔊 声音已开启';
  }else if(playing){
    statusEl.className='status warn'; statusEl.textContent='🔇 没声音？点这里启用';
  }else{
    statusEl.className='status'; statusEl.textContent='点「开始」应有声音（静音开关需关闭）';
  }
}
statusEl.onclick = function(){
  unlockAudio();
  playFallback(sub === 1 ? 'main' : 'sub');
  updateStatus();
};

/* ================= 构建节奏 ================= */
function buildCells(groups){
  cells = [];
  var count = 0;
  for(var gi=0; gi<groups.length; gi++){
    for(var k=0; k<groups[gi]; k++){
      cells.push({ group: gi, barBeat: count, groupStart: (k === 0) });
      count++;
    }
  }
}

function cellAccent(ci){
  var c = cells[ci];
  if(!c) return 0;
  if(c.barBeat === 0) return 2;
  if(c.groupStart) return 1;
  return 0;
}

function rebuildDots(){
  dotsEl.innerHTML = '';
  var n = cells.length;
  var total = n * sub;
  var showSub = total <= 48;
  var compact = total > 22;
  var curGroup = -1, groupEl = null;
  for(var i=0;i<n;i++){
    if(cells[i].group !== curGroup){
      curGroup = cells[i].group;
      groupEl = document.createElement('div');
      groupEl.className = 'group';
      groupEl.style.gap = compact ? '3px' : '5px';
      dotsEl.appendChild(groupEl);
    }
    var unit = document.createElement('div');
    unit.className = 'unit1';
    unit.style.gap = compact ? '2px' : '4px';
    for(var k=0; k<(showSub ? sub : 1); k++){
      var d = document.createElement('div');
      d.className = (k === 0 ? 'dot' : 'sdot');
      if(k === 0 && dotsEl.children.length > 0 && groupEl.children.length === 0) d.className += ' gp';
      if(compact){
        d.style.width = k===0 ? '9px' : '5px';
        d.style.height = k===0 ? '9px' : '5px';
      }
      unit.appendChild(d);
    }
    groupEl.appendChild(unit);
  }
}

function buildMeters(){
  var box = $('meters'); box.innerHTML = '';
  PRESETS.forEach(function(p){
    var b = document.createElement('button');
    var active = p.custom ? customActive : (!customActive && meterLabel === p.label);
    b.className = 'mini' + (active ? ' sel' : '');
    b.style.cssText = 'flex:1 1 30%;min-width:0;padding:8px 2px;font-size:12.5px;border-radius:10px';
    b.textContent = (p.custom && customActive) ? pattern.join('+') : p.label;
    b.style.fontSize = (p.custom && customActive && pattern.join('+').length > 5) ? '11px' : '12.5px';
    b.onclick = function(){
      if(p.custom){ openSheet(); return; }
      customActive = false;
      applyGroups(p.groups);
    };
    box.appendChild(b);
  });
}

function matchPreset(groups){
  for(var i=0;i<PRESETS.length;i++){
    var p = PRESETS[i];
    if(p.groups && p.groups.join('+') === groups.join('+')) return p.label;
  }
  return null;
}

function applyGroups(groups){
  pattern = groups.slice();
  var hit = matchPreset(groups);
  if(hit){ meterLabel = hit; customActive = false; }
  else { meterLabel = groups.join('+'); customActive = true; }
  buildCells(groups);
  curCell = 0; curSub = 0;
  rebuildDots();
  buildMeters();
  updateHint();
  if(playing){ queue.length = 0; nextPerf = nowSec() + 0.05; }
}


function buildTones(){
  var box = $('tones'); box.innerHTML = '';
  ['click','wood'].forEach(function(t){
    var b = document.createElement('button');
    b.className = 'mini' + (t === tone ? ' sel' : '');
    b.style.cssText = 'flex:1;min-width:0;padding:9px 2px;font-size:13px;border-radius:10px';
    b.textContent = TONE_NAMES[t];
    b.onclick = function(){
      tone = t;
      buildTones();
      if(playing){ /* 下一拍自动生效 */ }
      // 立刻给一声样例，方便老师挑
      unlockAudio();
      if(ctx && ctx.state === 'running') click(ctx.currentTime + 0.03, 0);
      else playFallback('main');
      // 双保险：WebAudio 不可用时也能听到试听
      if(!(ctx && ctx.state === 'running')) playFallback('main');
    };
    box.appendChild(b);
  });
}

function buildSubs(){
  var box = $('subs'); box.innerHTML = '';
  [1,2,3,4,6].forEach(function(n){
    var b = document.createElement('button');
    b.className = 'mini' + (n === sub ? ' sel' : '');
    b.style.cssText = 'flex:1;min-width:0;padding:9px 2px;font-size:13px;border-radius:10px';
    b.textContent = n;
    b.onclick = function(){
      sub = n; rebuildDots(); buildSubs(); updateHint();
      if(playing){ curSub = 0; queue.length = 0; nextPerf = nowSec() + 0.05; }
    };
    box.appendChild(b);
  });
}

function updateHint(){
  hintEl.textContent = SUB_NAMES[sub] + ' · 每小节 ' + cells.length + ' 拍 · 步进 −4 −3 ＋3 ＋4';
}

/* ================= 自定义分组面板 ================= */
var sheetEl = $('sheet'), ginEl = $('gin');
$('gcancel').onclick = function(){ sheetEl.classList.remove('show'); };
sheetEl.onclick = function(e){ if(e.target === sheetEl) sheetEl.classList.remove('show'); };
$('gok').onclick = function(){
  var parts = ginEl.value.trim().toUpperCase()
    .split('+').map(function(x){ return parseInt(x, 10); })
    .filter(function(x){ return x > 0 && x <= 32; });
  var sum = parts.reduce(function(a,b){ return a+b; }, 0);
  if(!parts.length || sum > 40){
    ginEl.style.borderColor = '#ef4444';
    setTimeout(function(){ ginEl.style.borderColor = '#2a3240'; }, 1200);
    return;
  }
  meterLabel = parts.join('+');
  customActive = true;
  applyGroups(parts);
  sheetEl.classList.remove('show');
};
function openSheet(){
  ginEl.value = pattern.join('+');
  sheetEl.classList.add('show');
  setTimeout(function(){ ginEl.focus(); }, 120);
}

/* ================= 调度 ================= */
function stepDur(){ return (60 / bpm) / sub; }

function scheduler(){
  var now = nowSec();
  while(nextPerf < now + SCHEDULE_AHEAD){
    var delay = Math.max(0, nextPerf - now);
    var isMain = (curSub === 0);
    var level = isMain ? cellAccent(curCell) : 3;
    var played = false;
    if(ctx && ctx.state === 'running'){
      played = click(ctx.currentTime + delay + 0.005, level);
    }
    queue.push({t: nextPerf, c: curCell, s: curSub, main: isMain, lv: level, fb: !played});
    nextPerf += stepDur();
    curSub++;
    if(curSub >= sub){ curSub = 0; curCell = (curCell + 1) % cells.length; }
  }
}

function paintTick(){
  if(!playing) return;
  var now = nowSec();
  while(queue.length && queue[0].t <= now){
    var q = queue.shift();
    if(q.fb) playFallback(q.lv === 2 ? 'acc' : (q.lv === 3 ? 'sub' : 'main'));
    paintBeat(q.c, q.s, q.main, q.lv);
  }
}

var flashTimer = null;
function paintBeat(ci, sIdx, isMain, level){
  var cell = cells[ci];
  if(!cell) return;
  var gEl = dotsEl.children[cell.group];
  if(!gEl) return;
  var idxInGroup = 0;
  for(var i = ci - 1; i >= 0 && cells[i].group === cell.group; i--) idxInGroup++;
  var units = gEl.children;
  for(var u=0; u<units.length; u++){
    var kids = units[u].children;
    for(var k=0; k<kids.length; k++){
      var isBeatDot = (k === 0);
      var on = (u === idxInGroup) && (isBeatDot ? sIdx === 0 : sIdx === k);
      var cls = isBeatDot ? 'dot' : 'sdot';
      if(isBeatDot && idxInGroup === 0) cls += ' gp';
      if(on){
        cls += ' on';
        if(isBeatDot && cell.barBeat === 0) cls += ' acc';
      }
      kids[k].className = cls;
    }
  }
  if(isMain){
    var strong = (level === 2);
    flashEl.className = 'flash' + (strong ? ' acc' : '');
    flashEl.style.opacity = strong ? 0.18 : (level === 1 ? 0.10 : 0.06);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ flashEl.style.opacity = 0; }, 70);
  }
}

function start(){
  unlockAudio();
  playing = true;
  curCell = 0; curSub = 0;
  queue.length = 0;
  nextPerf = nowSec() + 0.1;
  $('play').textContent = '停止';
  $('play').classList.add('stop');
  clearInterval(timerId);
  timerId = setInterval(scheduler, LOOKAHEAD_MS);
  scheduler();
  clearInterval(paintId);
  paintId = setInterval(paintTick, 16);
  updateStatus();
  setTimeout(updateStatus, 400);
}

function stop(){
  playing = false;
  clearInterval(timerId); timerId = null;
  clearInterval(paintId); paintId = null;
  queue.length = 0;
  $('play').textContent = '开始';
  $('play').classList.remove('stop');
  var groups = dotsEl.children;
  for(var i=0;i<groups.length;i++){
    var units = groups[i].children;
    for(var u=0;u<units.length;u++){
      var kids = units[u].children;
      for(var k=0;k<kids.length;k++) kids[k].className = (k===0 ? 'dot' : 'sdot');
    }
  }
  flashEl.style.opacity = 0;
  updateStatus();
}

/* ================= 交互 ================= */
$('play').onclick = function(){ playing ? stop() : start(); };

function setBpm(v){
  bpm = Math.min(240, Math.max(30, Math.round(v)));
  $('slider').value = bpm;
  $('bpm').textContent = bpm;
  $('val').textContent = bpm;
  if(typeof refreshStepLabels === 'function') refreshStepLabels();
}
$('slider').oninput = function(){ setBpm(parseInt(this.value, 10)); };
$('vol').oninput = function(){
  volume = parseInt(this.value, 10)/100;
  $('volv').textContent = this.value;
  if(master) master.gain.value = volume;
};
/* 专业节拍器步进规则（老师给的规格）：
   80 以下每次 ±3，80 及以上每次 ±4。
   刻度表以 80 为共同基准：低档 80-3k（80、77、74…32），高档 80+4k（80、84、88…240），
   所以边界永远不会出现 +2 / -2，来回切换都干净 */
function nextBpm(dir){
  if(dir > 0){
    return bpm < 80 ? Math.min(80, bpm + 3) : Math.min(240, bpm + 4);
  }
  return bpm > 80 ? Math.max(80, bpm - 4) : Math.max(30, bpm - 3);
}
function stepBy(d){
  setBpm(bpm + d);
}
function refreshStepLabels(){
  // 四个固定档位按钮，随时可用；到端点变暗
  var atTop = bpm >= 240, atBottom = bpm <= 30;
  $('p3').style.opacity = atTop ? .4 : 1;
  $('p4').style.opacity = atTop ? .4 : 1;
  $('m3').style.opacity = atBottom ? .4 : 1;
  $('m4').style.opacity = atBottom ? .4 : 1;
}
$('m4').onclick = function(){ if(bpm > 30) stepBy(-4); };
$('m3').onclick = function(){ if(bpm > 30) stepBy(-3); };
$('p3').onclick = function(){ if(bpm < 240) stepBy(3); };
$('p4').onclick = function(){ if(bpm < 240) stepBy(4); };

$('tap').onclick = function(){
  var t = performance.now();
  if(tapTimes.length && t - tapTimes[tapTimes.length-1] > 2000) tapTimes = [];
  tapTimes.push(t);
  if(tapTimes.length > 6) tapTimes.shift();
  if(tapTimes.length >= 2){
    var sum = 0;
    for(var i=1;i<tapTimes.length;i++) sum += tapTimes[i]-tapTimes[i-1];
    var b = Math.round(60000 / (sum/(tapTimes.length-1)));
    if(b >= 30 && b <= 240) setBpm(b);
  }
};

document.addEventListener('keydown', function(e){
  if(e.target.tagName === 'INPUT') return;
  if(e.code === 'Space'){ e.preventDefault(); playing ? stop() : start(); }
  if(e.key === 'ArrowUp'){ e.preventDefault(); stepBy(bpm < 80 ? 3 : 4); }
  if(e.key === 'ArrowDown'){ e.preventDefault(); stepBy(bpm > 80 ? -4 : -3); }
});

document.addEventListener('pointerdown', function(){
  if(!ctx || ctx.state !== 'running') unlockAudio();
}, true);

/* ================= 初始化 ================= */
buildCells([4]);
rebuildDots();
buildMeters();
buildSubs();
buildTones();
updateHint();
updateStatus();
refreshStepLabels();
</script>
</body>
